name: Site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate HTML
        run: npx --yes html-validate index.html 404.html

      - name: Check SEO files and canonical tag
        run: |
          test -f robots.txt
          test -f sitemap.xml
          grep -Fq '<link rel="canonical" href="https://piapps.dev/">' index.html
          grep -Fq 'Sitemap: https://piapps.dev/sitemap.xml' robots.txt
          grep -Fq '<loc>https://piapps.dev/</loc>' sitemap.xml

      - name: Check for forbidden internal details
        run: |
          set -e
          FILES=$(git ls-files)
          if grep -nE '([0-9]{1,3}\.){3}[0-9]{1,3}' $FILES; then
            echo "ERROR: IP address found in repository files"
            exit 1
          fi
          if grep -niE 'piapps[2]|/home/[z]k' $FILES; then
            echo "ERROR: Internal hostname or home path found in repository files"
            exit 1
          fi
