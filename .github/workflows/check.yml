name: Site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate HTML
        run: npx --yes html-validate index.html 404.html

      - name: Check SEO files and canonical tag
        run: |
          test -f robots.txt
          test -f sitemap.xml
          grep -Fq '<link rel="canonical" href="https://piapps.dev/">' index.html
          grep -Fq 'Sitemap: https://piapps.dev/sitemap.xml' robots.txt
          grep -Fq '<loc>https://piapps.dev/</loc>' sitemap.xml

      - name: Check cache-busting query versions
        run: |
          set -e
          INDEX_JS_V=$(grep -oE '/script\.js\?v=[0-9]+' index.html | head -n 1)
          NOTFOUND_JS_V=$(grep -oE '/script\.js\?v=[0-9]+' 404.html | head -n 1)
          if [ -z "$INDEX_JS_V" ] || [ "$INDEX_JS_V" != "$NOTFOUND_JS_V" ]; then
            echo "ERROR: index.html ($INDEX_JS_V) and 404.html ($NOTFOUND_JS_V) must use the same script.js ?v= version"
            exit 1
          fi
          if ! grep -Eq "from '\./src/data/projects\.js\?v=[0-9]+'" script.js; then
            echo "ERROR: script.js projects.js import is missing ?v= cache-busting query"
            exit 1
          fi

      - name: Check for forbidden internal details
        run: |
          set -e
          FILES=$(git ls-files)
          if grep -InE '([0-9]{1,3}\.){3}[0-9]{1,3}' $FILES; then
            echo "ERROR: IP address found in repository files"
            exit 1
          fi
          if grep -IniE 'piapps[2]|/home/[z]k' $FILES; then
            echo "ERROR: Internal hostname or home path found in repository files"
            exit 1
          fi
